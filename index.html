<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D Balance Lifting Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- ADDED: Three.js OBJ and MTL Loaders for CAD Files -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <!-- Socket.io for Multiplayer Sync -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); }
        .text-glow { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="text-white relative select-none focus:outline-none" tabindex="0">

    <!-- Status Panel (Top Left) -->
    <div class="absolute top-4 left-4 panel p-6 rounded-2xl shadow-2xl border border-slate-600 w-72 pointer-events-none transition-all z-40">
        <div class="flex justify-between items-start mb-1">
            <h1 class="text-xl font-bold text-blue-400 text-glow">Heavy Rig Sim</h1>
        </div>
        <p class="text-xs text-slate-300 mb-4 border-b border-slate-600 pb-4">7,000 lbs Load. 13,000 lbs Rig.</p>
        
        <div class="space-y-3 text-sm">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">System Pitch:</span>
                <span id="ui-state" class="font-bold text-green-400">Balanced</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Net Torque:</span>
                <span id="ui-torque" class="font-mono bg-slate-800 px-2 py-1 rounded">0 lb·ft</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Counterweight:</span>
                <span id="ui-cw" class="font-mono bg-slate-800 px-2 py-1 rounded">3.9 ft</span>
            </div>
            <div class="flex justify-between items-center border-t border-slate-600 pt-2 mt-2">
                <span class="text-slate-400">Network:</span>
                <span id="ui-network" class="font-bold text-slate-400">Offline (Local)</span>
            </div>
        </div>
    </div>

    <!-- Multiplayer Setup Panel -->
    <div id="multiplayer-panel" class="absolute top-4 left-[20rem] panel p-4 rounded-xl shadow-2xl border border-teal-500 w-80 pointer-events-auto z-40">
        <h2 class="text-lg font-bold text-teal-400 mb-2">Live Session</h2>
        <div class="grid grid-cols-2 gap-2">
            <button id="btn-host" class="bg-teal-700 hover:bg-teal-600 text-white py-2 rounded-lg text-sm font-bold shadow-lg transition-colors border border-teal-500 cursor-pointer touch-manipulation">Host (Physics)</button>
            <button id="btn-join" class="bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-sm font-bold shadow-lg transition-colors border border-slate-500 cursor-pointer touch-manipulation">Join (Viewer)</button>
        </div>
        <p id="multi-status" class="text-xs text-center text-slate-400 mt-2">Waiting for selection...</p>
    </div>

    <!-- Success Message -->
    <div id="success-msg" class="absolute top-1/4 left-1/2 transform -translate-x-1/2 panel px-8 py-4 rounded-xl shadow-2xl border border-green-500 opacity-0 transition-opacity duration-500 pointer-events-none text-center z-40">
        <h2 class="text-3xl font-bold text-green-400">Delivery Successful!</h2>
        <p class="text-slate-300 mt-1">Load safely secured on the platform.</p>
    </div>

    <!-- PIP Camera Frame (Top Right) -->
    <div id="pip-border" class="absolute top-4 right-4 w-72 h-48 border border-slate-400/50 rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.8)] z-40 overflow-hidden pointer-events-none flex flex-col justify-between p-1 bg-black/10 backdrop-blur-[1px]">
        <div class="text-red-500 text-[10px] font-bold font-mono animate-pulse drop-shadow-md">● REC</div>
        <div class="text-white/80 text-[10px] font-mono drop-shadow-md bg-black/40 inline-block px-1 rounded w-max">CAM 2: UNDER-BEAM</div>
    </div>

    <!-- Mobile D-Pad (Bottom Left) -->
    <div class="absolute bottom-6 left-6 grid grid-cols-3 gap-2 z-40 select-none w-48">
        <div></div>
        <button id="btn-trans-back" class="panel w-14 h-14 rounded-full border border-slate-500 text-white font-bold flex items-center justify-center active:bg-slate-600 touch-manipulation">W</button>
        <div></div>
        <button id="btn-trans-left" class="panel w-14 h-14 rounded-full border border-slate-500 text-white font-bold flex items-center justify-center active:bg-slate-600 touch-manipulation">A</button>
        <button id="btn-trans-fwd" class="panel w-14 h-14 rounded-full border border-slate-500 text-white font-bold flex items-center justify-center active:bg-slate-600 touch-manipulation">S</button>
        <button id="btn-trans-right" class="panel w-14 h-14 rounded-full border border-slate-500 text-white font-bold flex items-center justify-center active:bg-slate-600 touch-manipulation">D</button>
    </div>

    <!-- Action Buttons (Bottom Right) -->
    <div class="absolute bottom-6 right-6 grid grid-cols-2 gap-2 z-40 select-none w-80">
        <button id="btn-hoist-up" class="panel py-4 rounded-lg border border-blue-500 text-blue-300 font-bold active:bg-blue-800 shadow-lg touch-manipulation">Hoist Up</button>
        <button id="btn-hoist-down" class="panel py-4 rounded-lg border border-blue-500 text-blue-300 font-bold active:bg-blue-800 shadow-lg touch-manipulation">Hoist Down</button>
        <button id="btn-cw-fwd" class="panel py-4 rounded-lg border border-slate-500 text-white font-bold active:bg-slate-600 shadow-lg touch-manipulation">Bal Fwd</button>
        <button id="btn-cw-back" class="panel py-4 rounded-lg border border-slate-500 text-white font-bold active:bg-slate-600 shadow-lg touch-manipulation">Bal Back</button>
        <button id="btn-rot-ccw" class="panel py-4 rounded-lg border border-slate-500 text-white font-bold active:bg-slate-600 shadow-lg touch-manipulation">Rot CCW</button>
        <button id="btn-rot-cw" class="panel py-4 rounded-lg border border-slate-500 text-white font-bold active:bg-slate-600 shadow-lg touch-manipulation">Rot CW</button>
        <button id="btn-hook" class="col-span-2 panel py-4 rounded-xl border border-amber-500 text-amber-400 font-bold active:bg-amber-800 shadow-lg touch-manipulation transition-all duration-200 mt-2">Action: Hook (Out of Range)</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- CUSTOM RIG DIMENSIONS ---
        // Uses your exact CAD export measurements!
        const RIG_HOOK_X = -23.645; 
        const RIG_HOOK_Y = -18.214; 

        const g = 32.2; 
        const M_HOOK = 200; 
        const M_CW = 9000; 
        const M_LOAD = 7000; 
        const M_DEV = 13000; 
        
        let theta = 0;      
        let omega = 0;      
        let yaw = 0;        
        let yawVelocity = 0;
        let dcw = 3.36;     
        let isHooked = false;
        let tau_total = 0;  
        
        let pivotPos = new THREE.Vector3(0, 16, 0); 
        let pivotVel = new THREE.Vector3(0, 0, 0);
        const MAX_TRANS_SPEED = 5.0; 
        const TRANS_ACCEL = 8.0; 
        const TRANS_FRICTION = 4.0; 
        
        const L_CABLE = 7.0; 
        let loadPos = new THREE.Vector3();
        let loadVelocity = new THREE.Vector3(0, 0, 0);
        let loadYaw = 0; 
        let isTaut = false; 
        
        const keys = {};
        let gamepadHookTriggered = false; 
        const btnStates = { 
            cwFwd: false, cwBack: false, rotCCW: false, rotCW: false,
            transFwd: false, transBack: false, transLeft: false, transRight: false,
            hoistUp: false, hoistDown: false 
        };

        // ADDED: Safety catch to clear stuck keys if you click away to another window
        window.addEventListener('blur', () => {
            for (let k in keys) keys[k] = false;
            for (let k in btnStates) btnStates[k] = false;
        });

        let socket = null;
        let isHost = true; 
        let networkRole = "Offline";

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.005);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 30, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const pipCamera = new THREE.PerspectiveCamera(90, 480 / 288, 0.1, 1000); 

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(-15, 10, 0);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 150, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- ENVIRONMENT GEOMETRIES ---
        const groundGeo = new THREE.PlaneGeometry(300, 300);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a5d23, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(300, 150, 0x000000, 0x000000);
        gridHelper.material.opacity = 0.1;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const platformGeo = new THREE.BoxGeometry(20, 2, 20);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x5a6370, roughness: 0.6 });
        
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(-30, 99, 0); 
        platform.castShadow = true;
        platform.receiveShadow = true;
        scene.add(platform);
        
        function createStripeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffcc00'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = '#000000';
            for (let i = -256; i < 512; i += 64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 128, 256);
                ctx.lineTo(i + 128 + 32, 256); ctx.lineTo(i + 32, 0); ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        const stripeGeo = new THREE.PlaneGeometry(20, 20);
        const stripeTex = createStripeTexture();
        const stripeMat = new THREE.MeshBasicMaterial({ map: stripeTex });
        const platformTop = new THREE.Mesh(stripeGeo, stripeMat);
        platformTop.rotation.x = -Math.PI / 2;
        platformTop.position.set(-30, 100.02, 0);
        scene.add(platformTop);

        const platform2 = new THREE.Mesh(platformGeo, platformMat);
        platform2.position.set(-30, 109, 0); 
        platform2.castShadow = true;
        platform2.receiveShadow = true;
        scene.add(platform2);

        const platformTop2 = new THREE.Mesh(stripeGeo, stripeMat);
        platformTop2.rotation.x = -Math.PI / 2;
        platformTop2.position.set(-30, 110.02, 0);
        scene.add(platformTop2);

        const deviceGroup = new THREE.Group();
        deviceGroup.rotation.order = "YXZ"; 
        scene.add(deviceGroup);
        
        pipCamera.position.set(0, -13, 0); 
        deviceGroup.add(pipCamera);

        const yellowPaint = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4, metalness: 0.2 });
        const darkMetal = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8, roughness: 0.2 });

        // ========================================================
        // FALLBACK RIG LOGIC
        // ========================================================
        const placeholderRig = new THREE.Group();
        
        const axleGeo = new THREE.CylinderGeometry(0.8, 0.8, 4, 16);
        const axle = new THREE.Mesh(axleGeo, darkMetal);
        axle.rotation.x = Math.PI / 2;
        axle.castShadow = true;
        placeholderRig.add(axle);

        const mastGeo = new THREE.BoxGeometry(2, 10, 2);
        const mast = new THREE.Mesh(mastGeo, yellowPaint);
        mast.position.set(0, -5, 0);
        mast.castShadow = true;
        placeholderRig.add(mast);

        const beamGeo = new THREE.BoxGeometry(43, 2, 2);
        const beam = new THREE.Mesh(beamGeo, yellowPaint);
        beam.position.set(-0.5, -10, 0);
        beam.castShadow = true;
        placeholderRig.add(beam);

        deviceGroup.add(placeholderRig);

        // ========================================================
        // CUSTOM CAD RIG LOADER (.MTL + .OBJ)
        // ========================================================
        const mtlLoader = new THREE.MTLLoader();
        
        // 1. Try to load the materials first (case sensitive lowercase!)
        mtlLoader.load(
            'rig.mtl',
            function (materials) {
                materials.preload(); // Prepare the steel/satin colors
                
                const objLoader = new THREE.OBJLoader();
                objLoader.setMaterials(materials); // Apply colors to the loader
                
                // 2. Load the 3D model
                objLoader.load(
                    'rig.obj', 
                    function (object) {
                        placeholderRig.visible = false; // Hide fallback blocks
                        object.scale.set(0.00328, 0.00328, 0.00328); // CORRECTED: mm to feet
                        
                        // IF YOUR RIG IS POINTING BACKWARDS, UNCOMMENT THIS LINE:
                        // object.rotation.y = Math.PI; 
                        
                        // Ensure it casts shadows
                        object.traverse(function (child) {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        deviceGroup.add(object);
                        console.log("SUCCESS: rig.obj and rig.mtl loaded.");
                    },
                    undefined,
                    function (error) {
                        console.log("FAIL: rig.obj not found (check spelling/case). Using fallback blocks.");
                    }
                );
            },
            undefined,
            function (error) {
                console.log("WARNING: rig.mtl missing. Attempting to load rig.obj without materials...");
                // Fallback: If MTL is missing but OBJ exists, load OBJ alone with yellow paint
                const objLoader = new THREE.OBJLoader();
                objLoader.load(
                    'rig.obj', 
                    function (object) {
                        placeholderRig.visible = false;
                        object.scale.set(0.00328, 0.00328, 0.00328); // CORRECTED: mm to feet
                        object.traverse(function (child) {
                            if (child.isMesh) {
                                child.material = yellowPaint;
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });
                        deviceGroup.add(object);
                    },
                    undefined,
                    function (err) {
                        console.log("FAIL: Both files missing. Using fallback blocks.");
                    }
                );
            }
        );

        // ========================================================
        // 2. THE HOOK
        // ========================================================
        const hookVisual = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.2, 8, 16, Math.PI * 1.5), yellowPaint);
        hookVisual.position.set(RIG_HOOK_X, RIG_HOOK_Y, 0);
        hookVisual.rotation.z = -Math.PI / 4;
        hookVisual.castShadow = true;
        deviceGroup.add(hookVisual);


        // ========================================================
        // 3. COUNTERWEIGHT
        // ========================================================
        // 48" Long (4ft), 36" High (3ft), 28" Width (2.33ft)
        const cwGeo = new THREE.BoxGeometry(4, 3, 2.33);
        const cwMat = new THREE.MeshStandardMaterial({ color: 0x882222, metalness: 0.3, roughness: 0.7 });
        const counterweight = new THREE.Mesh(cwGeo, cwMat);
        counterweight.position.set(dcw, -14, 0); // Moved 4 feet lower (from -10 to -14)
        counterweight.castShadow = true;
        deviceGroup.add(counterweight);


        const gantryGeo = new THREE.BoxGeometry(6, 2, 6);
        const gantry = new THREE.Mesh(gantryGeo, darkMetal);
        scene.add(gantry);
        
        const gantryCable = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 400), darkMetal);
        scene.add(gantryCable);

        function createCrateTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = '#5c3a18'; ctx.lineWidth = 15;
            ctx.strokeRect(5, 5, 246, 246);
            ctx.beginPath(); ctx.moveTo(5, 5); ctx.lineTo(251, 251); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(251, 5); ctx.lineTo(5, 251); ctx.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        // ========================================================
        // 4. LOAD PLACEHOLDER
        // ========================================================
        const loadBoxGeo = new THREE.BoxGeometry(10, 5, 4);
        const loadBoxTex = createCrateTexture();
        const loadBoxMat = new THREE.MeshStandardMaterial({ map: loadBoxTex, roughness: 0.9 });
        const loadBox = new THREE.Mesh(loadBoxGeo, loadBoxMat);
        loadBox.castShadow = true;
        loadBox.receiveShadow = true;
        scene.add(loadBox);
        
        const spawnAngle = Math.random() * Math.PI * 2;
        const spawnRadius = Math.random() * 20;
        loadPos.set(Math.cos(spawnAngle) * spawnRadius, 2.5, Math.sin(spawnAngle) * spawnRadius);
        loadYaw = Math.random() * Math.PI * 2;

        const loadCable = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), darkMetal);
        loadCable.visible = false;
        scene.add(loadCable);

        window.addEventListener('keydown', (e) => {
            if (!isHost) return; 
            const key = e.key.toLowerCase();
            keys[key] = true;
            
            if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown'].includes(key)) {
                e.preventDefault();
            }

            if (key === ' ' && !keys.spaceTriggered) {
                keys.spaceTriggered = true;
                toggleHook();
            }
        }, { passive: false });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = false;
            if (key === ' ') keys.spaceTriggered = false;
        }, { passive: false });

        const setupBtn = (id, stateKey) => {
            const btn = document.getElementById(id);
            if (!btn) return;
            const enable = (e) => { if(isHost) { e.preventDefault(); btnStates[stateKey] = true; } };
            const disable = (e) => { e.preventDefault(); btnStates[stateKey] = false; };
            btn.addEventListener('mousedown', enable);
            btn.addEventListener('touchstart', enable, {passive: false});
            window.addEventListener('mouseup', disable); 
            window.addEventListener('touchend', disable);
        };
        setupBtn('btn-cw-fwd', 'cwFwd');
        setupBtn('btn-cw-back', 'cwBack');
        setupBtn('btn-rot-ccw', 'rotCCW');
        setupBtn('btn-rot-cw', 'rotCW');
        setupBtn('btn-trans-fwd', 'transFwd');
        setupBtn('btn-trans-back', 'transBack');
        setupBtn('btn-trans-left', 'transLeft');
        setupBtn('btn-trans-right', 'transRight');
        setupBtn('btn-hoist-up', 'hoistUp');
        setupBtn('btn-hoist-down', 'hoistDown');

        document.getElementById('btn-hook').addEventListener('click', (e) => {
            e.preventDefault();
            if(isHost) toggleHook();
        });

        const multiStatus = document.getElementById('multi-status');
        const uiNetwork = document.getElementById('ui-network');
        
        function initNetwork(role) {
            document.getElementById('multiplayer-panel').style.display = 'none';

            if (typeof io === 'undefined') {
                multiStatus.textContent = "Server missing. Running offline.";
                return;
            }
            
            try {
                socket = io(); 
                networkRole = role;
                
                socket.on('connect', () => {
                    uiNetwork.textContent = `Online (${role})`;
                    uiNetwork.classList.replace('text-slate-400', 'text-teal-400');
                });

                if (role === 'Viewer') {
                    isHost = false;
                    socket.on('stateUpdate', (state) => {
                        if (state.pivotPos) {
                            pivotPos.set(state.pivotPos.x, state.pivotPos.y, state.pivotPos.z);
                        }
                        theta = state.theta;
                        yaw = state.yaw;
                        dcw = state.dcw;
                        if (state.loadPos) {
                            loadPos.set(state.loadPos.x, state.loadPos.y, state.loadPos.z);
                        }
                        isHooked = state.isHooked;
                        loadYaw = state.loadYaw;
                        tau_total = state.tau_total;
                    });
                } else {
                    isHost = true;
                }
            } catch(e) {
                console.log("Connection failed", e);
            }
        }

        const handleHost = (e) => { e.preventDefault(); initNetwork('Host'); };
        const handleJoin = (e) => { e.preventDefault(); initNetwork('Viewer'); };

        document.getElementById('btn-host').addEventListener('click', handleHost);
        document.getElementById('btn-host').addEventListener('touchstart', handleHost, {passive: false});
        document.getElementById('btn-join').addEventListener('click', handleJoin);
        document.getElementById('btn-join').addEventListener('touchstart', handleJoin, {passive: false});

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            
            const pipBorder = document.getElementById('pip-border');
            if (pipBorder) {
                pipCamera.aspect = pipBorder.clientWidth / pipBorder.clientHeight;
                pipCamera.updateProjectionMatrix();
            }
            
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const globalHookPos = new THREE.Vector3();

        function toggleHook() {
            hookVisual.getWorldPosition(globalHookPos);
            if (!isHooked) {
                const dist = globalHookPos.distanceTo(loadPos);
                if (dist < L_CABLE + 4.0) { 
                    isHooked = true;
                    yaw = loadYaw;
                    yawVelocity = 0; 
                }
            } else {
                isHooked = false;
                loadYaw = yaw;
            }
        }

        const clock = new THREE.Clock();
        const uiState = document.getElementById('ui-state');
        const uiTorque = document.getElementById('ui-torque');
        const uiCw = document.getElementById('ui-cw');
        const successMsg = document.getElementById('success-msg');
        
        let lastSyncTime = 0;

        function updatePhysics(dt) {
            if (dt <= 0.001) return; 
            if (dt > 0.1) dt = 0.1; 

            if (isHost) {
                let padAx = 0, padAy = 0, padAz = 0;
                let padRotCCW = false, padRotCW = false, padCwFwd = false, padCwBack = false;
                
                let gp = null;
                try {
                    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                    gp = gamepads[0];
                } catch(e) {}

                if (gp) {
                    // Binary Digital Input (0 or 1) - DEADZONE 0.4
                    if (gp.axes[0] < -0.4) padAx = -TRANS_ACCEL;
                    else if (gp.axes[0] > 0.4) padAx = TRANS_ACCEL;
                    
                    if (gp.axes[1] < -0.4) padAz = -TRANS_ACCEL;
                    else if (gp.axes[1] > 0.4) padAz = TRANS_ACCEL;

                    // FIXED: Axis 3 is often an L2/R2 trigger that defaults to -1.0 when untouched!
                    // Switched to Gamepad D-Pad Up (12) and D-Pad Down (13) for Hoist.
                    if (gp.buttons[12]?.pressed) padAy = TRANS_ACCEL; 
                    if (gp.buttons[13]?.pressed) padAy = -TRANS_ACCEL; 

                    padRotCCW = gp.buttons[4]?.pressed || false;
                    padRotCW = gp.buttons[5]?.pressed || false;
                    padCwBack = gp.buttons[6]?.pressed || false; 
                    padCwFwd = gp.buttons[7]?.pressed || false; 

                    if (gp.buttons[0]?.pressed && !gamepadHookTriggered) {
                        toggleHook();
                        gamepadHookTriggered = true;
                    } else if (!gp.buttons[0]?.pressed) {
                        gamepadHookTriggered = false;
                    }
                }

                // Horizontal Input
                let ax = 0, az = 0;
                if (keys['w'] || btnStates.transBack) az -= TRANS_ACCEL;
                if (keys['s'] || btnStates.transFwd) az += TRANS_ACCEL;
                if (keys['a'] || btnStates.transLeft) ax -= TRANS_ACCEL;
                if (keys['d'] || btnStates.transRight) ax += TRANS_ACCEL;
                
                ax = ax || padAx;
                az = az || padAz;

                // Vertical Input (Strictly Separated)
                let ay = 0;
                let isHoisting = false;
                if (keys['arrowup'] || btnStates.hoistUp) { ay += TRANS_ACCEL; isHoisting = true; }
                if (keys['arrowdown'] || btnStates.hoistDown) { ay -= TRANS_ACCEL; isHoisting = true; }
                if (padAy !== 0) { ay = padAy; isHoisting = true; }

                // 1. Horizontal Physics
                pivotVel.x += ax * dt;
                pivotVel.z += az * dt;

                if (ax === 0) pivotVel.x -= Math.sign(pivotVel.x) * Math.min(Math.abs(pivotVel.x), TRANS_FRICTION * 0.5 * dt);
                if (az === 0) pivotVel.z -= Math.sign(pivotVel.z) * Math.min(Math.abs(pivotVel.z), TRANS_FRICTION * 0.5 * dt);

                const horizSpeed = Math.sqrt(pivotVel.x * pivotVel.x + pivotVel.z * pivotVel.z);
                if (horizSpeed > MAX_TRANS_SPEED) {
                    const scale = MAX_TRANS_SPEED / horizSpeed;
                    pivotVel.x *= scale;
                    pivotVel.z *= scale;
                }

                // 2. Vertical Physics (Crane Brake)
                if (isHoisting) {
                    pivotVel.y += ay * dt;
                    if (Math.abs(pivotVel.y) > MAX_TRANS_SPEED) {
                        pivotVel.y = Math.sign(pivotVel.y) * MAX_TRANS_SPEED;
                    }
                } else {
                    pivotVel.y = 0; // The Instant Crane Brake
                }

                pivotPos.addScaledVector(pivotVel, dt);

                if (pivotPos.y < 12) {
                    pivotPos.y = 12;
                    if (pivotVel.y < 0) pivotVel.y = 0;
                }

                const appliedYawTorque = 2160; 
                const I_yaw = (M_DEV / g) * (43 * 43 / 12) 
                            + (M_CW / g) * (dcw * dcw) 
                            + (M_HOOK / g) * (RIG_HOOK_X * RIG_HOOK_X) 
                            + (isHooked ? (M_LOAD / g) * (RIG_HOOK_X * RIG_HOOK_X) : 0);
                
                let yawAlpha = 0;
                if (btnStates.rotCCW || padRotCCW) yawAlpha += appliedYawTorque / I_yaw;
                if (btnStates.rotCW || padRotCW) yawAlpha -= appliedYawTorque / I_yaw;
                
                yawVelocity += yawAlpha * dt;
                yawVelocity *= (1.0 - 0.15 * dt); 
                yaw += yawVelocity * dt;

                if (btnStates.cwFwd || padCwFwd) dcw -= 5 * dt; 
                if (btnStates.cwBack || padCwBack) dcw += 5 * dt; 
                dcw = Math.max(-3, Math.min(20, dcw));

                hookVisual.getWorldPosition(globalHookPos);

                let tau_load = 0;
                let I_load = 0;

                if (isHooked) {
                    loadPos.copy(globalHookPos);
                    loadPos.y -= 2.5; 
                    loadVelocity.set(0, 0, 0);
                } else {
                    loadVelocity.y -= g * dt;
                    loadPos.addScaledVector(loadVelocity, dt);
                    loadVelocity.multiplyScalar(0.995); 
                }

                if (loadPos.y < 2.5) {
                    loadPos.y = 2.5;
                    if (!isHooked) {
                        loadVelocity.y = 0;
                        loadVelocity.x *= 0.8; 
                        loadVelocity.z *= 0.8;
                    }
                }

                const platforms = [
                    { minX: -40, maxX: -20, minY: 98, maxY: 102.5, minZ: -10, maxZ: 10 },    
                    { minX: -40, maxX: -20, minY: 108, maxY: 112.5, minZ: -10, maxZ: 10 }    
                ];

                for (const p of platforms) {
                    if (loadPos.x > p.minX && loadPos.x < p.maxX && loadPos.y > p.minY && loadPos.y < p.maxY && loadPos.z > p.minZ && loadPos.z < p.maxZ) {
                        const distLeft = loadPos.x - p.minX, distRight = p.maxX - loadPos.x;
                        const distTop = p.maxY - loadPos.y;
                        const distBack = loadPos.z - p.minZ, distFront = p.maxZ - loadPos.z;
                        
                        const minDist = Math.min(distLeft, distRight, distTop, distBack, distFront);
                        
                        if (minDist === distTop) {
                            loadPos.y = p.maxY;
                            if (!isHooked) {
                                loadVelocity.y = 0;
                                loadVelocity.x *= 0.8;
                                loadVelocity.z *= 0.8;
                            }
                        }
                        else if (minDist === distLeft) loadPos.x = p.minX;
                        else if (minDist === distRight) loadPos.x = p.maxX;
                        else if (minDist === distBack) loadPos.z = p.minZ;
                        else if (minDist === distFront) loadPos.z = p.maxZ;
                    }
                }

                if (isHooked) {
                    const intendedY = globalHookPos.y - 2.5;
                    if (intendedY >= loadPos.y - 0.05) { 
                        isTaut = true;
                        const loadDistX = RIG_HOOK_X * Math.cos(theta) - (RIG_HOOK_Y - 2.5) * Math.sin(theta); 
                        tau_load = -loadDistX * M_LOAD * g;
                        
                        const r2_load = (RIG_HOOK_X)**2 + (RIG_HOOK_Y - 2.5)**2;
                        I_load = M_LOAD * r2_load;
                    } else {
                        isTaut = false;
                        tau_load = 0;
                        I_load = 0;
                    }
                } else {
                    isTaut = false;
                }

                const hookDistX = RIG_HOOK_X * Math.cos(theta) - (RIG_HOOK_Y) * Math.sin(theta);
                const cwDistX = dcw * Math.cos(theta) - (-14) * Math.sin(theta); // Updated from -10 to -14
                const devDistX = -2 * Math.cos(theta) - (-8) * Math.sin(theta);

                const tau_hook = -hookDistX * M_HOOK * g;
                const tau_cw   = -cwDistX * M_CW * g;
                const tau_dev  = -devDistX * M_DEV * g;

                const tau_gravity = tau_hook + tau_load + tau_cw + tau_dev;
                const tau_damping = -omega * 10000000; 
                tau_total = tau_gravity + tau_damping;

                const r2_hook = (RIG_HOOK_X)**2 + (RIG_HOOK_Y)**2; 
                const r2_cw = dcw**2 + (-14)**2; // Updated from -10 to -14
                const r2_dev = (-2)**2 + (-8)**2;    

                const I_hook = M_HOOK * r2_hook;
                const I_cw   = M_CW * r2_cw;
                const I_dev  = M_DEV * r2_dev;
                const I_total = I_hook + I_load + I_cw + I_dev;

                const alpha = tau_total / I_total;
                omega += alpha * dt;
                theta += omega * dt;

                if (socket && socket.connected && Date.now() - lastSyncTime > 33) { 
                    socket.emit('stateUpdate', {
                        pivotPos: {x: pivotPos.x, y: pivotPos.y, z: pivotPos.z},
                        theta: theta,
                        yaw: yaw,
                        dcw: dcw,
                        loadPos: {x: loadPos.x, y: loadPos.y, z: loadPos.z},
                        isHooked: isHooked,
                        loadYaw: loadYaw,
                        tau_total: tau_total
                    });
                    lastSyncTime = Date.now();
                }
            } 

            counterweight.position.x = dcw;
            hookVisual.getWorldPosition(globalHookPos);
            
            deviceGroup.position.copy(pivotPos);
            deviceGroup.rotation.set(0, yaw, theta);

            gantry.position.set(pivotPos.x, pivotPos.y + 200, pivotPos.z);
            gantryCable.position.set(pivotPos.x, pivotPos.y + 100, pivotPos.z);
            gantryCable.scale.set(1, 1, 1); 

            if (isHooked) {
                loadCable.visible = true;
                const boxTop = new THREE.Vector3(loadPos.x, loadPos.y + 2.5, loadPos.z);
                const cableVec = new THREE.Vector3().subVectors(boxTop, globalHookPos);
                const dist = cableVec.length();
                if (dist > 0.01) {
                    loadCable.position.copy(globalHookPos).add(cableVec.clone().multiplyScalar(0.5));
                    loadCable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), cableVec.normalize());
                    loadCable.scale.set(1, dist, 1);
                }
            } else {
                loadCable.visible = false;
            }

            let winConditionMet = false;
            if (!isHooked) {
                const onPlat1 = Math.abs(loadPos.y - 102.5) < 0.01 && loadPos.x > -40 && loadPos.x < -20 && loadPos.z > -10 && loadPos.z < 10;
                const onPlat2 = Math.abs(loadPos.y - 112.5) < 0.01 && loadPos.x > -40 && loadPos.x < -20 && loadPos.z > -10 && loadPos.z < 10;
                if (onPlat1 || onPlat2) winConditionMet = true;
            }

            loadBox.position.copy(loadPos);
            loadBox.rotation.y = isHooked ? yaw : loadYaw; 

            const hookBtn = document.getElementById('btn-hook');
            if(isHost) {
                const distToLoad = globalHookPos.distanceTo(loadPos);
                if (!isHooked && distToLoad < L_CABLE + 4.0) {
                    hookBtn.classList.add('shadow-[0_0_15px_rgba(34,197,94,0.5)]', 'border-green-500', 'text-green-400');
                    hookBtn.classList.remove('border-amber-500', 'text-amber-400');
                    hookBtn.textContent = "Action: Hook Ready! (SPACE)";
                } else if (isHooked) {
                    hookBtn.classList.remove('shadow-[0_0_15px_rgba(34,197,94,0.5)]', 'border-green-500', 'text-green-400');
                    hookBtn.classList.add('border-amber-500', 'text-amber-400');
                    hookBtn.textContent = "Action: Drop Load (SPACE)";
                } else {
                    hookBtn.classList.remove('shadow-[0_0_15px_rgba(34,197,94,0.5)]', 'border-green-500', 'text-green-400');
                    hookBtn.classList.add('border-amber-500', 'text-amber-400');
                    hookBtn.textContent = "Action: Hook (Out of Range)";
                }
            } else {
                hookBtn.textContent = "Viewer Mode (No Controls)";
                hookBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            uiTorque.textContent = `${Math.round(tau_total).toLocaleString()} lb·ft`;
            uiCw.textContent = `${dcw.toFixed(1)} ft`;

            if (Math.abs(tau_total) < 20000) {
                uiState.textContent = "Balanced"; uiState.className = "font-bold text-green-400";
            } else if (tau_total > 20000) {
                uiState.textContent = "Tipping Backward"; uiState.className = "font-bold text-orange-400";
            } else {
                uiState.textContent = "Tipping Forward"; uiState.className = "font-bold text-red-400";
            }

            if (winConditionMet) successMsg.classList.remove('opacity-0');
            else successMsg.classList.add('opacity-0');
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            updatePhysics(dt);
            controls.update();
            
            deviceGroup.updateMatrixWorld(); 
            pipCamera.lookAt(loadPos.x, loadPos.y - 4, loadPos.z);

            renderer.setScissorTest(true);

            renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
            renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
            renderer.render(scene, camera);

            const pipBorder = document.getElementById('pip-border');
            if (pipBorder) {
                const rect = pipBorder.getBoundingClientRect();
                const pipX = rect.left;
                const pipY = window.innerHeight - rect.bottom;
                const pipW = rect.width;
                const pipH = rect.height;

                renderer.setViewport(pipX, pipY, pipW, pipH);
                renderer.setScissor(pipX, pipY, pipW, pipH);
                renderer.render(scene, pipCamera);
            }

            renderer.setScissorTest(false);
        }

        window.onload = animate;
    </script>
</body>
</html>
